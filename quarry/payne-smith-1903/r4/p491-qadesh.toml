# -- Ethpaal added 2026-09-02 -------------------------------------------------
# Read off the SAME plate (n506, left column, four lines below the Pael headword).
# Nothing new was fetched; the earlier crop simply stopped above this line, which is what
# the old uncertain_note recorded. The entry stacks Peal* / Pael / Ethpa. under one root,
# exactly as predicted.
# Shape: `stems` is an optional R4 field (SYRIAC-LANGUAGE-PILOT.md section 4) whose form the
# schema leaves open - Nestle uses it as a one-line string (r4/g184-qam-stand.toml). Here it
# is a STRUCTURED ARRAY instead, following the house `[[sub_lemmas]]` habit: same root entry
# on the same plate, so a sub-entry on THIS record rather than a record of its own, and
# `raw` keeps the printed piece verbatim.
[[stems]]
stem = "Ethpaal"
printed_label = "ETHPA."
unvoc = "ܐܬܩܕܫ"
voc = ""   # intentionally empty - see vocalization_note below
translit = "'tqdsh"   # consonantal only, matching the head lemma's convention
gloss_en = "to be sanctified, consecrated; to be joined in marriage"
raw = "ETHPA. ܐܬܩܕܫ to be sanctified, consecrated; to be joined in marriage."
vocalization_note = "Vowel points ARE printed on this form and are visible at 8x, and are deliberately NOT transcribed, for the same reason as the head lemma: this project has no control table for this typeface's pointing, and a diacritic is never read by eye. The five-letter consonantal skeleton Alaph-Taw-Qoph-Dalath-Shin is unambiguous - its last three glyphs were compared side by side against the Pael headword four lines above, which prints the bare root. The dot under the Dalath is letter-identifying (Dalath vs. Rish), not vocalisation, and is carried in the codepoint."
printed_note = "The entry carries a small RAISED typographic mark, which the Pael headword carries too (there above the second radical, here at the right-hand end of the word). It is not identified, and is neither transcribed nor interpreted here."
plate_note = "Crop for the re-read: n506 at (195, 2590)-(420, 2690), upscaled 8x."

