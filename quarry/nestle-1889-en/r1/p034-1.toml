# "should" produce. That composition (state-table × suffix-set) is downstream work for whoever
# consumes this record, done with the base tables (`r1/p023-1`, `r1/p023-2`, `r1/p031-1`) in
# hand, not baked in here. Expect this shape to recur in other primers — Nestle is not unusual
# in teaching noun-suffixation as a rule rather than a grid.

id = "nestle-1889-en/r1/p034-1"
record_type = "R1"
kind = "rule"

category = "noun: possessive-suffix attachment (rule + worked examples, not a printed table)"
layer = "vocalized Serto"
