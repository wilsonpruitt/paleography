caveat = "Nöldeke's §70 is NOT a 12-class survey like this plate — one worked example (the adjective 'wicked') covering only the GENERAL state-ending pattern (masc. sg. abs/cstr bare, emph +ā; masc. pl. abs -in, cstr -ay, emph -ē; fem. sg. abs +ā, cstr +ath, emph +āthā; fem. pl. abs -ān, cstr -āth, emph -āthā). So this check validates ENDING SHAPES across all twelve rows, not lexeme-by-lexeme forms the way p043's verb check could."
result = """
CONFIRMED for the masculine rows (I.a, I.c-d, I.f-h, II.a): every one uses exactly Nöldeke's
masc. pattern (-Ø/-Ø/-ā singular, -in/-ay/-ē plural) — I.a's malkin/malkay/malkē is a textbook
match. I.e's irregular yawmāthā-shaped plural emphatic is independently explained by
Nöldeke's rule too: 'day' is a known exception that borrows the FEMININE plural ending onto a
masculine noun — the `uncertain_note` on that row correctly named this rather than silently
normalizing it.

⚠ NOT resolved, and arguably sharpened: row I.b ('foot')'s plural columns used the masculine
-in/-ay/-ē pattern, but if the lexeme really is reglā (a feminine noun), Nöldeke's general
rule predicts -ān/-āth/-āthā instead — a real mismatch, not just a reading-confidence gap.
This tier-1 check can't settle WHICH is wrong (the plate reading, the lexeme identification,
or an exception this table is illustrating on purpose) — it only confirms the mismatch is real
and worth a second plate look before Step 3, not resolved by a memorized paradigm either way.
II.b ('witness') stays open for the same reason — its abstract-noun-shaped ending doesn't map
cleanly onto either the adjective paradigm here or a simple agent-noun pattern.
"""
