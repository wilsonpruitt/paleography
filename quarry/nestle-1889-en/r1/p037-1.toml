# no Syriacist seat (deferred by Wilson's ruling 2026-09-02).
#
# HIGHER CONFIDENCE than the other records landed this session: the plate prints an Arabic
# numeral (1-19, then 20-90 by tens) directly beside each masc./fem. word pair, so the
# lexeme-identity question that made p031/p043 partly uncertain does not arise here — every
# cell's referent is unambiguous from the print itself, not inferred from a memorized paradigm.
# Filed `kind = "lexical-table"`, same precedent as p132 (a closed, glossed list, not a single
# lexeme's inflection).
#
# ⭐ Bears directly on `SYRIAC-LANGUAGE-PILOT.md` ruling 7 (2026-09-02, Wilson): numerals are
# to be TAUGHT as a decoding system (alphabet-like), not vocabulary pairs. This record still
# just captures what §33 prints — the drill-shape consequence is the lesson-plan's job, not
# this record's — but the cross-reference is worth keeping visible for whoever builds that
# lesson.

