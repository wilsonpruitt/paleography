teens_rule_en = """
To form the numbers from 11 to 19, -ʿsar is added for the masculine, -ʿesrē for the feminine,
to a shortened form of the units. (Nestle's own wording, p.37.) Orthographic note printed on
the same page: the circumflex mark is often omitted over the dalath of ḥmeš(ʿsar) 'ten' in the
compound.
"""
tens_rule_en = """
The tens are the plural forms of the units (including ḥmeš 'ten') and are of common gender —
i.e. one form serves both masc. and fem. (Nestle's own wording, p.37.) Printed with their own
Arabic-numeral labels (20, 30, ... 90), not derived here.
"""

