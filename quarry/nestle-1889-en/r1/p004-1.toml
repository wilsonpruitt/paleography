# R1, alphabet table — extracted 2026-09-02, on demand for SYRIAC-LESSON-PLAN.md's Lesson 0
# (Wilson's own request, after running Lesson 1: "more on the alphabet itself and decoding").
# This is exactly the lesson-driven R1 pull §7a reasoned toward — extract the cells a chosen
# lesson actually needs, not the whole R1 body blind. Read from the plate at leaf n21 (p.4)
# and n22 (p.5, the accompanying "3. VOWEL-SCHEME" prose that names the three hands).
id = "nestle-1889-en/r1/p004-1"
record_type = "R1"

lexeme = "alphabet"
category = "alphabet table"
kind = "reference-table"   # same qualifier pattern as p132's "lexical-table" — not a verb/noun paradigm

table_note = """
Nestle's own table, "2. ALPHABET" (p.4), columns: Name (his transliteration) · Form, not
joined · Form joined (to letter preceding / to preceding and following / to letter following)
· Value (phonetic, numerical). Each "Form" cell prints TWO glyphs side by side — read as two
different Syriac hands shown for comparison, per Nestle's own enumeration one page later
(p.5, "3. VOWEL-SCHEME": "1) the oldest Majuscle, known as Estrangelo... 2) A smaller
character, Semiminuscle, adopted by the Jacobites" = Serto). Column order therefore read as
LEFT = Estrangelo, RIGHT = Serto, matching that enumeration — flagged `uncertain` below since
the plate carries no printed caption naming which column is which; the lesson content built
from this record uses standard Unicode Estrangela shaping rather than replicating Nestle's
1889 letterforms pixel-for-pixel, so this ambiguity does not propagate into the lesson.
"""
uncertain = true
uncertain_note = "Which printed column is Estrangelo vs Serto is inferred from p.5's prose order, not from a caption on the table itself."

# Independent cross-check, worth recording: the 8 letters whose 'joined to preceding a.
# following' and 'joined to letter following' columns print '—' (i.e. they never join
# forward) are Ålaf, Dålath, He, Vav, Zain, Såde, Rīsh, Tau — EXACTLY the set already named in
# the hand-trainer's own orientation prose (registry/languages/syriac.toml `orient`: "ܐ ܕ ܗ ܘ
# ܙ ܨ ܪ ܬ"). Two independent sources for one project fact now agree.
non_joining_letters = ["alaph", "dalath", "he", "waw", "zain", "sadhe", "rish", "taw"]

