work_note = """
The page opens inside the Life of ELISHA, whose one-word rubric `ܐܠܝܫܥ ܂` stands on p. 104
line 12 (= piece line 369). One Life boundary falls here, marked by the usual cue — a one-word
name rubric alone on its own line, closed by a low point:
· line 8 of the page (= piece line 385) `ܐܝܘܒ ܂` — JOB.

⭐ AND THAT IS A REAL FINDING, not a slip of the eye. The word was read at ~11x on four clean,
unambiguous glyphs — alaph "≺" · yudh (tiny blob) · waw (closed loop with a leg) · beth
(flat-topped hook with a leftward foot) — and there is no competing candidate at that shape.
**JOB IS NOT IN Schermann's Latin capitulum of Sinai Syr. 10 at all**, whose 22 run Moyses …
Ioel, with Malachias appended. So Nestle's British-Museum recension carries a Life the Sinai
witness does not, and the control is silent on the whole of this page's second half. Job does
stand in some Greek/Syriac recensions of the Lives, so this is a recension difference to be
recorded, not an anomaly to be explained away — but it should be checked by a Syriacist against
Schermann's GREEK recensions A-E (pp. 1-104) before it is asserted in print.

Nestle names no individual codex; "e tribus codicibus Musei Britannici" (p. 86) is all he says,
and he never says which of the three. No `witness` field exists in the schema — known gap.
"""
