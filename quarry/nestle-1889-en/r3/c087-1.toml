reason = """
No digital text exists for the Syriac Vitae Prophetarum in any licence-checked source, and
unlike the Peshitta pieces there is nothing PD to fall back on either — no printed critical
edition to check against, no compute-only database that knows this text. Every page of the piece
(pp. 86-107, 22 pages, ~350 lines) is full plate transcription, unvocalized, with NO diff target
of any kind.

⭐ This is the real division inside R3, and it is not the licence line:
· Peshitta pieces (Genesis pp. 67-78, Matthew 5 pp. 79-85, 22 pages) — keyed by us, but
  CHECKABLE against SEDRA and a PD 1905 scan.
· Vitae Prophetarum (pp. 86-107, 22 pages) — keyed by us, SENSE-checkable against Schermann's
  Latin of the Syriac Sinai witness, in a language Wilson reads.
· Historia inventionis (pp. 108-131, 24 pages) — keyed by us and diffable CHARACTER BY CHARACTER
  against Nestle's own De sancta cruce (1889), from which he lifted the piece. Strong as a
  transcription check, worthless as a textual one: same editor, same year, not independent.
⭐ REVISED 2026-09-01 — no page of the chrestomathy is now without a control.
"""

