work_note = """
**Codex: cod. Paris. 234** - Nestle's sub-head is `1) e cod. paris. 234.`, printed under the
work head on p. 108. This is sub-piece IV.1, the first of THREE named codices printed one after the
other in Chrest. IV; every record in pp. 108-131 states which of the three it belongs to, because
`work` alone cannot carry it (the gap R3(a) flagged when Genesis 4 switched to cod. Ambrosianus -
here the same thing happens twice in 24 pages, and once MID-PAGE).
Nestle collates Paris. 234 by folio AND column: the markers on these pages are
`(fol. 293, recto, col. 1.)` / `(a, col. 2.)` / `(b, col. 1)` / `(b, col. 2)` / `(f. 294, a, 1)` /
`(a, 2.)` / `(fol. 295, a, col. 1.)`, i.e. `recto` = `a`, `verso` = `b`, and the abbreviation style
varies freely between them. IV.1 = 101 lines over pp. 108-113a, spanning foll. 293r-295r.
⭐ Line 1 of the whole piece opens `ܬܘܒ ܬܫܥܝܬܐ ܕ…` (tūb tašʿītā d-…, 'Again, the history of …'), read at ~5.5x on a quarter-width crop and confirmed letter by letter against the Serto column of Nestle's own alphabet table (p. 4, leaf n21). That is the only Syriac in this slice the pass vouches for; the rest of the line and everything after it are not vouched for and are not recorded.
⭐ **RULED - and this is the trap the record exists to close.** Nestle's published corrigenda
in De sancta cruce ("Korrekturen zu meiner Abschrift von B: Z. 148 lies …, 216 …, 261 …, 343 …; zu
Z. 44 siehe die Praef. der Porta … z. B. Z. 222") **do NOT touch Chrestomathia IV.** In that
footnote A and B are MANUSCRIPT SIGLA, not De sancta cruce's section letters: A = Bodl. Libr. MS.
Marsh 13 (dated fol. 243v, A.D. 1177) and B = Mus. Brit. Add. 12,174 anni 1196 - the manuscript
behind DSC's *first* section, `A.) (E COD. LONDIN. ADD. 12174 ANNI 1196.)`. That text runs to line
345/346, which is why both the corrigenda and the collation apparatus headed `A [= Bodl. Libr. Ms.
Marsh 13]` reach line 343 - a line number the Historia inventionis never reaches (IV.1 = 101 lines,
IV.2 = 274, IV.3 = 92).
⛔ The near-miss is the whole danger: 44, 148, 216, 222 and 261 are ALL valid line numbers inside
Chrest. IV.2, and 216 and 261 are exactly the lines that carry `(fol. 22 vers.)` and `(f. 23 vers.)`.
A later session that "applies Nestle's own corrigenda" to IV.2 would silently corrupt five lines of
a text they were never written about. What makes it look as though they belong is that the
apparatus is printed physically AFTER our text - DSC pp. 37-38, "steht S. 37. 38 hinter dem Text
von B die vollständige Collation von A". It does not belong to it.

"""

