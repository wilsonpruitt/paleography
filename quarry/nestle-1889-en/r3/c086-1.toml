  · COST: 20 plate-image reads for this one page — 7 half- or third-width strips of 4-6 lines
    each, plus 13 narrower crops and single-word zooms — on top of the band-detection runs.
    A doubtful word costs about one extra image read to resolve, and often does not resolve.

WHY THE YIELD IS WHAT IT IS. The plate has resolution to spare: cropped horizontally to a third
of the page width the individual Estrangela letterforms are sharp, the seyame and the rish/dalath
points are unambiguous, and Nestle's own alphabet table (p. 4, leaf n21) serves as the letterform
key. The limit is not the scan. It is that reading Estrangela here means naming each glyph in
sequence and then recognising the word, and this pass's glyph-by-glyph identification is reliable
enough to recover a word it can already anticipate (ܡܛܠ, ܗܘܐ, ܐܢܘܢ, ܬܚܝܬ, ܕܪܘܓܝܠ,
ܕܫܝܠܘܚܐ, ܕܡܬܦܫܩ, ܕܐܝܬܘܗܝ) and NOT reliable enough to recover an unfamiliar one from letters
alone. That is why the readable words cluster on the narrative's proper names and formulae and
why whole lines of ordinary Syriac prose drop out. It is also a warning about the readable ones:
where a guess looks apt, the aptness may be coming from the sense, not from the letters.

WHAT IS STILL OWED: the 8 unread lines, and confirmation of the 9 flagged words, by a reader of
Estrangela or by an HTR pass with a blind control on a sample (cf. [[reference_arabic-control-rule]]).
Everything structural in this record — page numeral, line count, marginal numbers, layer, absence
of footnotes, section boundaries — is independent of the text and stands as measured.
"""

