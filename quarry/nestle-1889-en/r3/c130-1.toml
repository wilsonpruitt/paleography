row below its weakest: IV.1/IV.2 = character-level but not independent; Chrest. III = sense-level
via Latin; **IV.3 = no control.**

⭐ But IV.3 is the one sub-piece whose source Nestle NAMES, and that is a lead: the bracketed line
under the sub-head reads `[ex explanatione officiorum ecclesiasticorum a Georgio Arbelensi
conscripta.] (I, 24.)`. So this is **not a third recension of the legend at all** - it is an excerpt
from a different work, George of Arbela's *Expositio officiorum ecclesiae*, book I ch. 24, which
quotes the Finding of the Cross. (Nestle's own bibliography cites him for it: "B. O. III, 1. 1:725.
Georgius Arbel. Kreuzauffindung".) An edition exists - R. H. Connolly, CSCO Script. Syri, 1911-15 -
but it is NOT on the Phase 0 pinned shelf and its licence is unchecked, so nothing is claimed
against it here. ⚑ Whoever pins it should note that it would be the only genuinely INDEPENDENT
witness anywhere in Chrest. IV, i.e. a textual control rather than a transcription one.

⚑ The `work` field records this as a George-of-Arbela excerpt, not as "recension 3". Filing it
under the legend alone would lose the fact that Nestle changed WORKS here, not just witnesses -
the same class of thing as Genesis 4 switching to cod. Ambrosianus in Chrest. I, but larger.
