**Codex: cod. Vat. syr. 148 (a. Chr. 1267)** - Nestle's sub-head is `3) e Cod. Vat. syr. 148
(a. Chr. 1267).`, and under it a second bracketed line that changes what this sub-piece IS:
`[ex explanatione officiorum ecclesiasticorum a Georgio Arbelensi conscripta.] (I, 24.)`.
⭐ So IV.3 is **not a third recension of the legend**: it is an excerpt from George of Arbela's
*Expositio officiorum ecclesiae*, book I ch. 24, which quotes the Finding of the Cross. Nestle
changed WORKS here, not merely witnesses - a bigger version of Chrest. I's switch to cod.
Ambrosianus, and the reason `work` for these five pages names George of Arbela.
IV.3 = 92 lines over pp. 127-131. **No folio markers at all** - Nestle cites Vat. syr. 148 by
neither folio nor column anywhere in the five pages; the only apparatus is his own footnotes and
in-text parentheses, both of which IV.1 and IV.2 entirely lack.

⚑ De sancta cruce does NOT contain this sub-piece, so nothing here is affected by Nestle's
corrigenda in that book (which in any case belong to a different manuscript altogether - see the
IV.1/IV.2 records).
"""

