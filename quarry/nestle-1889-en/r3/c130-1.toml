⛔ DELIBERATE NON-TRANSCRIPTION, not a failed plate fetch. Reasons, in order:

1. **Unvocalized Serto carrying an unknown text.** R3(a) worked because it keyed texts it already
   knew (Genesis, Matt. 5) and then checked them, and because Chrest. I is VOCALIZED Serto, where
   the points disambiguate the skeleton. Chrest. IV is unvocalized Serto carrying a legend for which
   no digital edition exists anywhere (ruled 2026-09-01, research/syriac-peshitta-editions.md).
   Nothing primes the read; every word is a cold glyph-by-glyph decision.
2. **The master scan is 1586 x 2512 px.** Checked 2026-09-01: `page/nNNN.jpg`, the same URL with
   `?scale=0/1/2`, and the `_jp2.zip` member all return that identical size, so there is no
   higher-resolution copy of this scan to escalate to. Serto pairs that differ by one hook or one
   dot (dalath/rish, the yud/shin/semkath peaks, medial nun vs. lamadh vs. alaph) sit at the edge of
   it; past ~2.5x the enlargement is interpolation, not information.
3. **The house rule forbids the alternative.** [[reference_arabic-control-rule]] and
   SYRIAC-LANGUAGE-PILOT.md §5/§8: never read codepoints by eye; an extractor that is unsure flags
   rather than extracting "to be safe". A confidently wrong Syriac line is worse than a blank one.
4. **Keying from the diff target would poison the diff.** De sancta cruce is the clearer of the two
   settings (1726 px scan, larger type on the page). Keying from IT and then "diffing" against the
   Grammatik would make the agreement an artefact of the method - the circularity R3(a) refused when
   it declined to peek at BFBS for Matt. 5:5.

⭐ What is owed here is a reader with Syriac, or a Serto-trained HTR model, working from De sancta
cruce and the Grammatik side by side. Everything else in this record - line numbering, the
folio/column collation, the codex boundaries, the footnote apparatus, the De sancta cruce
line-for-line correspondence, the corrigenda ruling - is done and does not need redoing.
"""

