reason = """
⭐ TEXT KEYED FROM THE PLATE 2026-09-01, replacing this record's earlier "TEXT NOT KEYED IN THIS
PASS". That earlier refusal was the wrong call — a page keyed at a measured rate with every gap
marked is worth more to a ground-truth corpus than no page at all — and the method below is
recorded so the next pass can reproduce and improve on it.

Three things made a keyed pass possible where the structural pass gave up:
 1. **Nestle's own Estrangela alphabet table (p. 4 = leaf n21) was pulled first** and the BOLD
    glyph in each cell used as the letterform key. Two traps it settles: taw is a bowl with a tall
    right ascender (NOT "S"-like), and mim carries a left-descending leg that at line scale reads
    like a final-nun tail.
 2. **Word slots were segmented mechanically, not by eye.** A column-ink scan of each detected
    line band, splitting on horizontal gaps of ≥11 px, yields the exact number of word runs per
    line and their x-ranges. That is why the slot COUNT in `text_syr_voc` is trustworthy even
    where the word inside the slot is not: the boundaries are measured, the letters are read.
    Marginal numerals and specks were excluded by x-position.
 3. **Each run was then cropped on its own and tiled onto contact sheets grouped by run width**,
    so a two- or three-letter word is rendered at 6-10x instead of the ~2x a half-width line
    strip gives it. This is what lifted the rate: the short runs are overwhelmingly ܡܢ / ܕܝܢ /
    ܗܘܐ / ܗܘܘ / ܠܐ / ܗܕܐ / ܗܘ and the pause marks, and at that magnification they are
    unambiguous. ⭐ Concretely, ܕܝܢ and ܡܢ are told apart by ONE feature: ܕܝܢ carries the dalath
    point BELOW its first glyph; ܡܢ does not, its first glyph being the closed mim loop. Both
    then run into the same long tapering final-nun tail.

WHAT IS STILL NOT KEYED: the long runs — the narrative interior, most place-names, and every word
whose shape did not resolve to a word this pass could name. Those carry ⟨?…⟩, one per measured
slot. A minority of readings are keyed but flagged ⟨?word⟩: the letters were read, the word was
not certain. Every flagged reading is listed in the alignment table's diff.

⚠ THE HONEST COMPARISON: r3/c099-1.toml, the shard's quality bar, reached ~50% of word-slots
keyed. This shard runs 46% on p. 87 and 30-37% on pp. 88-91. The difference is lexical, not
optical — the plate is legible at these crops; what runs out is the reader's Syriac. The pages
that do best are the ones dense in the Vitae's formulaic vocabulary (name rubrics, tribe and
burial formulas); the Life of Ezekiel on p. 91 has least of it and keys worst.

⛔ No flagged reading was arrived at by consulting the Latin control or any translation. The
plate was read first; the control was checked afterwards, and what it did and did not confirm is
recorded in the alignment table's diff.

⚠ COUNTING NOTE for anyone who re-measures: a pause point (`܂`, `܆`) normally sits inside the
preceding word's ink-run and is NOT a separate measured slot, so the token count of a line in
`text_syr_voc` runs a little above its slot count wherever a point is written. Where a point DID
stand as its own run (p. 88 line 45, p. 89 lines 69 and 77, p. 90 line 97) it is counted as a
slot. The slot totals quoted in `status` are the measured ones.

WHAT IS STILL OWED: verification by a reader of Estrangela, or an HTR pass with a blind control
on a sample (cf. [[reference_arabic-control-rule]]).
"""

