ܪܰܚܫܳܐ ܕܰܐܪܥܳܐ ܠܓܶܢܣܰܘ̈ܗܝ: ܘܰܚܙܳܐ ܐܰܠܳܗܳܐ ܕܫܰܦܺܝܪ. ²⁶ ܘܶܐܡܰܪ
ܐܰܠܳܗܳܐ: ܢܶܥܒܶܕ ܐ̱ܢܳܫܳܐ ܒܨܰܠܡܰܢ ܐܰܝܟ ܕܡܘܬܰܢ.. ܘܢܶܫܬܰܠܛܘܢ
ܒܢܘܢ̈ܰܝ ܝܰܡܳܐ: ܘܰܒܦܳܪܰܚܬܳܐ ܕܰܫܡܰܝܳܐ: ܘܒܰܒܥܺܝܪܳܐ ܘܰܒܟܽܠܳܗ̇
ܐܰܪܥܳܐ: ܘܰܒܟܽܠܶܗ ܪܰܚܫܳܐ ܕܪܳܚܶܫ ܥܰܠ ܐܰܪܥܳܐ. ²⁷ ܘܰܒܪܳܐ
