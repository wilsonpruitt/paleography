line 8 (= piece line 405) to the end of Chrest. III on p. 107:
    line 6:  ܫܠܡ ܕ⟨?⟩ …
    line 7:  ܐܦܝܣܩܘܦܐ ܕܩܘܦܪܘܣ ܀
`ܐܦܝܣܩܘܦܐ ܕܩܘܦܪܘܣ` ("bishop of Cyprus") is an INCLUSIO with the piece's own opening on p. 86
line 3 (`ܕܩܕܝܫܐ ܐܦܝܦܢܝܘܣ ܐܦܝܣܩܘܦܐ ܕܩܘܦܪܘܣ ܂`), and `ܫܠܡ` is the ordinary Syriac "here ends".
Both words were verified glyph by glyph at ~9-11x: ܕܩܘܦܪܘܣ as dalath · qoph · waw · pe · rish
(dot above) · waw · semkath (the closed double lobe, unmistakable), and the end mark as FOUR
dots in a diamond, i.e. ܀ not ܂. Schermann's Latin colophon — "Haec autem conscripserunt
Epiphanius de Cypro et Cornel(i)us de Ierusalem" — independently says that the Syriac tradition
pairs an Epiphanius text with a second one, which is exactly the seam seen here.
⚠ WHAT THE SEQUEL IS, AND WHOSE, WAS NOT READ. Lines 8-20 are continuous text with no rubric
anywhere on the page; the only rubric in the remainder of the piece stands on p. 107 line 9. The
natural hypothesis from the Latin is Cornelius of Jerusalem, but that is NOT a reading and is not
recorded as one. Whoever verifies this should read p. 106 lines 8-10 first — that is where a
second attribution would stand.
Nestle names no individual codex; "e tribus codicibus Musei Britannici" (p. 86) is all he gives.
No `witness` field exists in the schema — known gap.
"""
