cue established on p. 103 that is a paragraph break inside Azariah, not a boundary. Both its
words resisted reading.
Nestle names no individual codex; the piece is "e tribus codicibus Musei Britannici" (p. 86) and
he never says which. No `witness` field exists in the schema — known gap.
"""
