WHAT THE CONTROL CONFIRMED: `X. Elisaeus fuit ex tribu Ruben, eratque discipulus Eliae.` —
ELISHA is in the Sinai list, so the rubric I read at line 369 names a prophet the tradition
actually carries. That is the whole of the confirmation available for this page.
WHAT IT CANNOT DO: AZARIAH, whose Life occupies lines 358-368, is NOT in the Latin capitulum's 22
