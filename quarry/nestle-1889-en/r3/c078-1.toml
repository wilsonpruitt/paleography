transcription_method = """
Read from the plate, line by line, off 3.0–5.5x crops cut by horizontal projection (one strip
per 2–4 printed lines); the 1.75x half-crops of tools/quarry_fetch.sh are NOT sufficient for
pointed Serto and were used only for orientation. Consonantal skeleton, seyame, word division,
punctuation, verse numerals, marginal line numerals and square-bracket supplements are read
directly. ⚠ HONEST LIMIT, per the never-read-codepoints-by-eye rule: the West-Syriac vowel
points are legible AS SHAPES at this resolution (zqofo prints as a small circle, ptoho as an
open triangle, and so on — calibrated on ܐܰܠܳܗܳܐ, which recurs on every page), but the finest
layer — rukkakha/qushshaya bars, the ܗ̇ point, linea occultans — is recorded where seen and is
not warranted point-by-point. The vocalisation below is therefore a plate reading at the
word level, not a certified diacritic-level edition; a blind control on a sample
([[reference_arabic-control-rule]]) is still owed before this text is shipped.
"""

