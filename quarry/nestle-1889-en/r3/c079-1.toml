                      codepoint an encoder should later choose)
· single dot pause  → ܂ (U+0700)
· two-dot vertical  → ܆ (U+0706)
· diamond/four-dot  → ܀ (U+0700-block end mark, U+0701 not used)
The qushshaya/rukkakha and participle points that the plate carries on individual letters are
NOT transcribed — they are below the resolution at which this pass can be honest about them,
and their absence here is a KNOWN GAP, not a claim that the plate lacks them.
"""

