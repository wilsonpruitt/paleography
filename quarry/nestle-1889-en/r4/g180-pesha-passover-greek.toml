primer_note = "⭐⭐ THE SAME FEAST, TWICE, UNDER TWO SPELLINGS AND NEVER LINKED. Here it is ܦܶܣܚܳܐ with semkath, glossed 'τὸ πάσχα' — the ὁ νόμος shape, Greek with its article, i.e. marked as a LOAN. On the very next page-half Nestle prints ܦܶܨܚܳܐ with sadhe, glossed 'Passah | Passover', as a sub-lemma of the Semitic root ܦܨܚ 'be cheerful'. Both spellings are in their correct alphabetical slots, which is the only reason they are two entries; nothing tells the reader they are one word."

