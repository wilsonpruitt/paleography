uncertain_note = "Two doubts, and they compound. (1) The reading: five glyphs, ܠ + angular + circle + angular + alaph, read ܠܒܽܘܟܳܐ; ܠܽܘܒܳܟܳܐ is the same skeleton under a different segmentation and is equally possible at 3×. (2) The SLOT: it stands between ܠܰܝܬ (p. 164) and ܠܰܡ, but a ܠܒܟ word belongs a page and a half earlier, beside ܠܒܶܟ 'seize hold'. Either the reading is wrong or the placement is — which is likely why the entry is bracketed and queried at all."

