primer_note = "⭐ THE BRACKET QUESTION, third sighting and the first that shows what the shape means: '[ܠܒܽܘܟܳܐ m. Verwirrung | confusion.?]' — square brackets with Nestle's own '?' INSIDE them, before the closing bracket. Read against [ܝܠܠ] (p. 158, an unattested root in the slot that normally takes round brackets) and [ܠܒܰܪ v. ܒܰܪ] (p. 164, a whole cross-reference), the common factor is not the CONTENT but the doubt: the square bracket appears to mark an entry Nestle is not prepared to stand behind. ⬜ Still nobody's ruling, but the question is now sharper than 'round vs square'."
