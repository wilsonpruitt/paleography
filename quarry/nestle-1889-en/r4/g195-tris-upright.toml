primer_note = "⭐⭐ THE LAST SUBSTANTIVE ENTRY IN THE GLOSSARY, and it is a CALQUE laid bare. ܬܪܺܝܨ ܫܽܘܒܚܳܐ, 'straight of glory', is glossed by ὀρθόδοξος and nothing else — and its second word ܫܽܘܒܚܳܐ is a sub-lemma of ܫܰܒܰܚ six pages back (p. 189), where Nestle glossed it 'praise, glory; δόξα'. The Syriac word for orthodoxy is Greek reassembled in Syriac, and the glossary has given the reader both halves without once saying so. It is the whole method of the book in one line."

