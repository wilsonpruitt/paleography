uncertain_note = "⛔ NOT READ, after one 3× zoom, and the gloss is certain while one letter of the head is not. Three or four glyphs: ܩ, a rounded middle letter, and a long final down-left stroke read as ܠ. ⚑ The slot decides against the eye and p. 185b confirms it. The entry stands between ܩܰܠܺܝܠ and ܩܢܳܐ, so its middle letter must sort between ܠ and ܢ — i.e. ܡ. The reading the glyph first suggested, ܥ, is excluded twice over: ܩܥ sorts after ܩܢ, and ܩܥܳܐ 'cry out' is itself a head-word further down this same page, in its correct place. So the word is ܩܡ-ܠ with a middle letter this scan does not carry, and convention 5 forbids writing ܩܰܡܶܠ on that reasoning alone. Convention 10: the following column adjudicated the preceding one."

