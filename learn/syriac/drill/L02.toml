[[halfline]]
context = "Genesis 1:6"
prompt = "ܘܶܐܡܰܪ <span class='blank'></span>"
answer = "ܐܰܠܳܗܳܐ"
translit = "alāhā"
note = "God"
[[halfline]]
context = "Genesis 1:8"
prompt = "ܠܰܪܩܺܝܥܳܐ <span class='blank'></span>"
answer = "ܫܡܰܝܳܐ"
translit = "šmayyā"
note = "heaven"
[[halfline]]
context = "Genesis 1:8"
prompt = "ܘܰܗܘܳܐ ܨܰܦܪܳܐ <span class='blank'></span>"
answer = "ܝܰܘܡܳܐ"
translit = "yawmā"
note = "day"
[[halfline]]
context = "Genesis 1:9"
prompt = "<span class='blank'></span> ܡܰܝ̈ܳܐ"
answer = "ܢܶܬܟܰܢܫܘܢ"
translit = "netkanšūn"
note = "let them be gathered"
[[halfline]]
context = "Genesis 1:10"
prompt = "ܘܰܚܙܳܐ ܐܰܠܳܗܳܐ <span class='blank'></span>"
answer = "ܕܫܰܦܺܝܪ"
translit = "d-šappīr"
note = "that it was beautiful"

[[cloze]]
context = "Genesis 1:6"
prompt = "ܘܶܐܡܰܪ <span class='blank'></span>: ܢܶܗܘܶܐ ܪܩܺܝܥܳܐ ܒܰܡܨܰܥܰܬ ܡܰܝ̈ܳܐ."
answer = "ܐܰܠܳܗܳܐ"
translit = "alāhā"
note = "God"
[[cloze]]
context = "Genesis 1:8"
prompt = "ܘܰܩܪܳܐ ܐܰܠܳܗܳܐ ܠܰܪܩܺܝܥܳܐ <span class='blank'></span>."
answer = "ܫܡܰܝܳܐ"
translit = "šmayyā"
note = "heaven"
[[cloze]]
context = "Genesis 1:8"
prompt = "ܘܰܗܘܳܐ ܪܰܡܫܳܐ ܘܰܗܘܳܐ ܨܰܦܪܳܐ <span class='blank'></span> ܕܰܬܪܶܝܢ"
answer = "ܝܰܘܡܳܐ"
translit = "yawmā"
note = "day"
[[cloze]]
context = "Genesis 1:9"
prompt = "<span class='blank'></span> ܡܰܝ̈ܳܐ ܕܰܠܬܰܚܬ ܡܶܢ ܫܡܰܝܳܐ ܠܰܐܬܪܳܐ ܚܰܕ."
answer = "ܢܶܬܟܰܢܫܘܢ"
translit = "netkanšūn"
note = "let them be gathered"
[[cloze]]
context = "Genesis 1:10"
prompt = "ܘܰܚܙܳܐ ܐܰܠܳܗܳܐ <span class='blank'></span>."
answer = "ܕܫܰܦܺܝܪ"
translit = "d-šappīr"
note = "beautiful"

[[finish]]
context = "Genesis 1:6"
prompt = "ܘܶܐܡܰܪ ܐܰܠܳܗܳܐ: ܢܶܗܘܶܐ ܪܩܺܝܥܳܐ <span class='blank'></span>"
answer = "ܒܰܡܨܰܥܰܬ ܡܰܝ̈ܳܐ"
translit = "bamṣaʿaṯ mayyā"
note = "where?"
[[finish]]
context = "Genesis 1:10"
prompt = "ܘܰܩܪܳܐ ܐܰܠܳܗܳܐ ܠܝܰܒܺܝܫܬܳܐ <span class='blank'></span>"
answer = "ܐܰܪܥܳܐ"
translit = "arʿā"
note = "what did he call it?"
[[finish]]
context = "Genesis 1:13"
prompt = "ܘܰܗܘܳܐ ܪܰܡܫܳܐ ܘܰܗܘܳܐ ܨܰܦܪܳܐ ܝܰܘܡܳܐ <span class='blank'></span>"
answer = "ܕܰܬܠܳܬܳܐ"
translit = "d-tlāṯā"
note = "the third day, this time"

[[whole]]
context = "Genesis 1:6, unaided"
prompt_type = "text"
prompt = "“and God said, let there be a firmament in the midst of the waters”"
answer = "ܘܶܐܡܰܪ ܐܰܠܳܗܳܐ: ܢܶܗܘܶܐ ܪܩܺܝܥܳܐ ܒܰܡܨܰܥܰܬ ܡܰܝ̈ܳܐ."
translit = "w-emar alāhā: nehwē rqīʿā bamṣaʿaṯ mayyā"
note = "consonants alone count as a full success"

[[drills]]
prompt = "ܘܶܐܡܰܪ ܐܰܠܳܗܳܐ: ܢܶܗܘܘܢ ܡܰܝ̈ܳܐ ܒܝܰܡ̈ܡܶܐ."
answer = "And God said: let there be water in the seas."
[[drills]]
prompt = "ܘܰܩܪܳܐ ܐܰܠܳܗܳܐ ܠܰܐܪܥܳܐ ܝܰܒܺܝܫܬܳܐ."
answer = "And God called the earth dry-land."
[[drills]]
prompt = "ܘܰܚܙܳܐ ܐܰܠܳܗܳܐ ܕܫܰܦܺܝܪ ܐܺܝܠܳܢܳܐ."
answer = "And God saw that the tree was beautiful."
[[drills]]
prompt = "ܘܰܗܘܳܐ ܪܰܡܫܳܐ ܘܰܗܘܳܐ ܨܰܦܪܳܐ ܝܰܘܡܳܐ ܕܰܬܠܳܬܳܐ."
answer = "And there was evening and there was morning, the third day."

