# Drill sidecar for Lesson 2 -- built (not transcribed from an artifact; L02 postdates
# "First Light") for Phase C, SYRIAC-WEB-PLAN.md §5. vocab/forms/halfline/cloze/finish/
# whole/drills content is pulled from learn/syriac/LESSON-2.md itself (Stage 0-4, the
# Drills block, and the Scorecard section) -- SYRIAC-LESSON-PLAN.md's "New lemmas"/"New
# form cells" lines for Lesson 2 were used only as a checklist of WHAT to extract, never
# as the source of an exact Syriac string or gloss.
#
# halfline is the one judgment call per §3/§5: LESSON-2.md has no separate "Half a line"
# stage, so these 5 items reuse Stage 2's own 5 target words (ܐܰܠܳܗܳܐ/ܫܡܰܝܳܐ/ܝܰܘܡܳܐ/
# ܢܶܬܟܰܢܫܘܢ/ܕܫܰܦܺܝܪ) at a shorter 2-3-word fragment length, per the plan's own steer.

