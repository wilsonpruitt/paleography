[[whole]]
context = "Genesis 1:16, unaided"
prompt_type = "text"
prompt = "“and God made two great luminaries — the great luminary to rule the day, and the small luminary to rule the night — and the stars”"
answer = "ܘܰܥܒܰܕ ܐܰܠܳܗܳܐ ܬܪܶܝܢ ܢܰܗܺܝܪ̈ܶܐ ܪܰܘܪ̈ܒܶܐ: ܢܰܗܺܝܪܳܐ ܪܰܒܳܐ ܠܫܘܠܛܳܢܳܐ ܕܺܐܝܡܳܡܳܐ: ܘܢܰܗܺܝܪܳܐ ܙܥܘܪܳܐ ܠܫܘܠܛܳܢܳܐ ܕܠܺܠܝܳܐ: ܘܟܰܘܟ̈ܒܶܐ."
translit = "w-ʿḇaḏ alāhā trēn nahīrē rawrḇē, nahīrā rabbā l-šulṭānā d-īmāmā, w-nahīrā zʿōrā l-šulṭānā d-līlyā, w-ḵawḵḇē"
note = "add the seyāmē dots where they belong — that's today's specific target"

