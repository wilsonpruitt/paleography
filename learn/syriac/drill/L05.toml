[[whole]]
context = "Genesis 2:3a, unaided"
prompt_type = "text"
prompt = "“and God blessed the seventh day, and sanctified it”"
answer = "ܘܒܪܟ ܐܠܗܐ ܠܝܘܡܐ ܫܒܝܥܝܐ ܘܩܕܫܗ."
translit = "w-bareḵ alāhā l-yawmā šḇīʿāyā w-qaddšeh"
note = "unpointed, consonants only — that IS the target today"

