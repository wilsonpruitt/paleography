[[finish]]
context = "Genesis 1:26"
prompt = "ܘܶܐܡܰܪ ܐܰܠܳܗܳܐ: ܢܶܥܒܶܕ ܐ̱ܢܳܫܳܐ ܒܨܰܠܡܰܢ <span class='blank'></span>"
answer = "ܐܰܝܟ ܕܡܘܬܰܢ"
translit = "ayḵ demūṯān"
note = "as WHAT?"
[[finish]]
context = "Genesis 1:28"
prompt = "ܦܪܰܘ ܘܰܣܓܰܘ ܘ<span class='blank'></span>"
answer = "ܡܠܰܘ ܐܰܪܥܳܐ ܘܟܘܒܫܘܗ̇"
translit = "mlaw arʿā w-ḵūḇšūh"
note = "finish the chain of three"
[[finish]]
context = "Genesis 1:28"
prompt = "ܘܰܫܠܰܛܘ ܒܢܘܢ̈ܰܝ ܝܰܡܳܐ: ܘ<span class='blank'></span>"
answer = "ܒܦܳܪܰܚܬܳܐ ܕܰܫܡܰܝܳܐ"
translit = "b-p̄āraḥtā d-šmayyā"
note = "and in what, of heaven?"

[[whole]]
context = "Genesis 1:27, unaided"
prompt_type = "text"
prompt = "“and God created Adam in his image; in the image of God he created him”"
answer = "ܘܰܒܪܳܐ ܐܰܠܳܗܳܐ ܠܳܐܕܳܡ ܒܨܰܠܡܶܗ. ܒܰܨܠܶܡ ܐܰܠܳܗܳܐ ܒܰܪܝܶܗ."
translit = "w-ḇrā alāhā l-āḏām b-ṣalmeh, b-aṣlem alāhā barāyeh"
note = "consonants alone count as a full success"

