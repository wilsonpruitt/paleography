# Manual scorecard fields, transcribed from LESSON-1.md's own "## Scorecard" section
# (ground truth over First Light's hardcoded Lesson-1-shaped panel, per instructions to
# prefer the current .md when the two diverge -- checked, they don't diverge on the counts
# that matter: Stage 2 = 5 gaps = len(cloze) below; Stage 3 = 4 completions = len(finish)).
[scorecard]
stage0_question = "could you use the letter table as a reference while reading?"
stage1_of = 7
stage1_label = "by the second read-through, roughly how many of the seven lines could you get through leaning on the pronunciation line only at the hard spots?"
stage2_of = 5
stage2_label = "how many of the five gaps on the second (closed-book) pass?"
stage3_of = 4
stage3_label = "how many of the four completions?"
stage4_options = ["written from memory", "written by transcribing your own Latin letters", "not yet"]
