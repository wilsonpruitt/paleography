# Drill sidecar for Lesson 0 -- transcribed VERBATIM from the "First Light" private Claude
# Artifact (2026-09-02), the throwaway prototype Wilson G2-passed running Lesson 0 end to
# end. This is the source of truth for L00's drill content; SYRIAC-WEB-PLAN.md §3: "carry
# them over verbatim, don't re-derive." Do not hand-edit a Syriac string here without also
# checking it still matches learn/syriac/LESSON-0.md -- and see the KNOWN GAP note below.
#
# KNOWN GAP, flagged not silently resolved: First Light's `pairs` track (10 two-letter
# nonsense strings -- ܒܓ ܕܛ ܗܟ ܘܡ ܙܢ ܚܣ ܝܥ ܠܨ ܩܫ ܦܬ) does NOT occur anywhere in the current
# LESSON-0.md text. Verified: `grep` for all ten strings against LESSON-0.md returns zero
# hits. LESSON-0.md's own structure has no "Pairs" section -- Part 1 tests single letters
# in 7-letter batches, Part 3 goes straight to the 6 triples/quadruples (which DO match
# LESSON-0.md's "Decoding drills" verbatim). This data is transcribed here anyway, per the
# explicit instruction to carry First Light's constants over verbatim rather than
# re-derive -- but the `pairs` track will fail a strict per-lesson verbatim check against
# LESSON-0.md, and that failure is real, not a bug in the check. Wilson's call: either
# LESSON-0.md gains a Pairs section (matching what was G2-passed in the prototype), or the
# `pairs` track is dropped from L00 and this file trimmed to match. Not resolved here.

