translit = "ellā p̄aṣṣān men bīšā"
note = "but do what instead?"

[[whole]]
context = "The Lord's Prayer, unaided"
prompt_type = "text"
prompt = "the whole prayer, from memory — then write verse 9 (line 1) from memory"
answer = "ܐܰܒܽܘܢ ܕܒܰܫܡܰܝܳܐ ܢܶܬܩܰܕܰܫ ܫܡܳܟ ܬܺܐܬܶܐ ܡܰܠܟܽܘܬܳܟ ܢܶܗܘܶܐ ܨܶܒܝܳܢܳܟ"
translit = "aḇūn d-ḇašmayyā, netqaddaš šmāḵ, tīteh malkūṯāḵ, nehwē ṣeḇyānāḵ"
note = "consonants alone count as a full success"

