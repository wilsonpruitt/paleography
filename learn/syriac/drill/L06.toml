[[finish]]
context = "Line 1"
prompt = "ܐܰܒܽܘܢ ܕܒܰܫܡܰܝܳܐ <span class='blank'></span>"
answer = "ܢܶܬܩܰܕܰܫ ܫܡܳܟ ܬܺܐܬܶܐ ܡܰܠܟܽܘܬܳܟ ܢܶܗܘܶܐ ܨܶܒܝܳܢܳܟ"
