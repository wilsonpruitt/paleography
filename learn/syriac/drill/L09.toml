[[whole]]
context = "Genesis 4:9, unaided"
prompt_type = "text"
prompt = "“where is Abel your brother? — I do not know; am I my brother's keeper?”"
answer = "ܘܐܡܪ ܡܪܝܐ ܠܩܐܝܢ. ܐܝܟܘ ܗܒܝܠ ܐܚܘܟ. ܘܐܡܪ. ܠܐ ܝܕܥ ܐܢܐ. ܢܛܘܪܗ ܐܢܐ ܕܐܚܝ."
translit = "w-emar māryā l-Qayn: aykaw Hāḇēl aḥūḵ. w-emar: lā yāḏaʿ ennā; nāṭūreh ennā d-āḥī"
note = "consonants alone count as a full success"

