<title>__TITLE__ — A Syriac Chrestomathy</title>
<style>
:root{--ink:#14120F;--surface:#1E1B17;--raised:#2A2621;--line:#3A342D;
 --text:#EAE4DA;--muted:#A0958A;--dim:#7B7168;--accent:#5B82BE;--accent-soft:#2F415E;
 --serif:"EB Garamond",Georgia,serif;--sans:"IBM Plex Sans",-apple-system,sans-serif;
 --syr:"Noto Sans Syriac","Estrangelo Edessa",serif;--r:3px}
:root[data-theme="light"]{--ink:#F2EEE7;--surface:#FBF9F5;--raised:#FFF;--line:#DED7CB;
 --text:#211E19;--muted:#5F574C;--dim:#857C70;--accent:#2E4B7A;--accent-soft:#DDE5F1}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
 --ink:#F2EEE7;--surface:#FBF9F5;--raised:#FFF;--line:#DED7CB;
 --text:#211E19;--muted:#5F574C;--dim:#857C70;--accent:#2E4B7A;--accent-soft:#DDE5F1}}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);
 font-size:17px;line-height:1.66;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:28px 22px 80px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
 padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:30px}
h1.wm{font-family:var(--serif);font-size:24px;font-weight:400;margin:0}
h1.wm a{color:var(--text);text-decoration:none}
.spacer{flex:1}
header .navlinks{display:flex;gap:14px}
header a.nav{color:var(--muted);text-decoration:none;font-size:15px;white-space:nowrap}
header a.nav:hover{color:var(--text)}
h1{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.25;margin:0 0 6px}
h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:36px 0 10px;
 padding-top:16px;border-top:1px solid var(--line)}
h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:24px 0 8px;color:var(--text)}
h4{font-size:14px;margin:18px 0 6px;color:var(--muted)}
p{margin:0 0 14px}
em{color:var(--muted)}
strong{font-weight:600}
code{font-family:var(--syr);unicode-bidi:isolate;font-size:19px;background:var(--surface);
 border:1px solid var(--line);border-radius:var(--r);padding:1px 5px}
pre{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
 padding:14px;overflow-x:auto}
pre code{border:0;background:none;padding:0}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:26px 0}
ul,ol{margin:0 0 14px;padding-left:22px}
li{margin:5px 0}
blockquote{margin:0 0 18px;padding:2px 18px;border-left:3px solid var(--accent-soft);
 background:var(--surface);border-radius:0 var(--r) var(--r) 0;
 font-family:var(--syr);font-size:19px;unicode-bidi:isolate}
blockquote p{margin:10px 0}
.tablewrap{overflow-x:auto;margin:0 0 18px}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px;text-transform:uppercase;
 letter-spacing:.05em}
tbody tr:last-child td{border-bottom:0}
.footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);
 font-size:14.5px;color:var(--muted)}
.footer a{color:var(--accent)}
.footer ul{list-style:none;margin:8px 0 0;padding:0}
.footer li{margin:4px 0}
.badge{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
 border:1px solid var(--line);border-radius:var(--r);padding:1px 6px;color:var(--dim);
 margin-left:6px}
.lessonnav{display:flex;justify-content:space-between;gap:14px;margin-top:36px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<header>

  <div class="spacer"></div>
  <nav class="navlinks">
    <a class="nav" href="/sources">sources</a>
    <a class="nav" href="/for-syriacists">for syriacists</a>
  </nav>
</header>
