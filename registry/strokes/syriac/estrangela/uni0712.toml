# See uni0710.toml's header note on coordinate provenance -- same method.
# Second correction on this letter: Kiraz's own figure (§505, zoomed off the
# scan) shows pt1 with pt2 just LEFT of it and pt3 just RIGHT -- i.e. after
# the pt1->pt2 nub and the retrace, "continues to pt3" carries on PAST pt1
# in the original rightward direction, not back leftward. In this font the
# short pt1->pt3 hop of Kiraz's compact diagram is stretched into the whole
# flat top (measured x 400->800) before the curve down through the loop
# (x 800->889) to baseline. The first fix here had pt1 at the loop end,
# which skipped the entire flat top -- Wilson caught it missing "tracking".

# Third round: the loop's own arc was undersampled (2 points across a near-
# 180-degree turn), and the switch to Catmull-Rom actually made that worse
# -- wide spacing through a sharp turn overshoots and wobbles with this
# spline where the old one didn't. Fixed the same way as Ālap's crotch:
# more real measurements, not a different curve-fitting trick.

[[stroke]]
median = [[420, 385], [370, 375], [800, 355], [834, 300], [848, 240], [853, 180], [848, 120], [819, 80], [500, 38], [150, 45], [75, 76]]
status = "confirmed"
source = "kiraz-2012 §505 (Estrangela Bēt, isolated -- one broken stroke)"
note = """
"The stroke begins at pt 1 just around the mean line. It moves a short
distance to the left to pt 2, then traces itself back to pt 1 and continues
to pt 3. At pt 2, the pen moves down slightly, creating a clubbed end. At pt
3, the stroke curves and changes direction downward to the baseline at pt 4.
Then, it changes direction again and moves horizontally to the left" to the
tail at pt 6 (isolated allograph). One TOML median approximates Kiraz's
retrace (pt1->pt2->pt1->pt3) as a single pass through the nub rather than
literally doubling back -- the animation reads the same either way.
"""
