# Coordinates are measured, not guessed: sampled from the rendered outline's
# own ink (column/row centerlines of the rasterized glyph, tools/strokes.py's
# debug rig) at the x/y Kiraz's prose points to. Wilson caught the first pass
# (hand-guessed against the prose alone) visibly missing the actual ink --
# see git history. Order, stroke count, direction and every quoted phrase
# are Kiraz's; only the numbers are this font's.
#
# Second round: Wilson caught this diagonal still reading slightly off after
# the first fix. Cause: the top diagonal isn't straight (it curves), but the
# median only had 2 points (start + crotch), so a straight interpolation
# drifted off the true centerline mid-stroke -- same cause hit the left leg
# too, which bows left before returning right to its tip; a straight
# crotch->tip jump cut across empty space and the clip dropped it entirely
# (the disconnected fragment Wilson would have seen next). Both segments now
# sampled densely along their real curve, not just their endpoints.

# Third round: Wilson correctly diagnosed the real cause after the smoothing
# swap didn't fix it -- the crotch isn't a sharp point at all, it's a short
# region (roughly y 300-320) where the two arms' ink actually MERGES into one
# blob before the notch opens up below it. Jumping straight from the
# diagonal's point to the leg's point cut across that notch. Added a point
# anchored inside the measured merge zone so the curve stays in real ink.

[[stroke]]
median = [[910, 546], [700, 432], [500, 358], [300, 320], [260, 298], [120, 270], [145, 150], [170, 10]]
status = "confirmed"
source = "kiraz-2012 §502 (Estrangela Ālap, stroke 1)"
note = """
"Stroke 1-2-3 draws the horizontal shaft and the first leg of the graph. It
begins half-way between the mean and ascender lines at pt 1, moves downward
and to the left to pt 2, then makes a sharp turn and continues downward to
pt 3, ending either on, or slightly below, the baseline. In some hands, the
stroke is clubbed at pt 1."
"""

[[stroke]]
median = [[410, 255], [500, 189], [600, 110], [700, 48], [730, 10]]
status = "confirmed"
source = "kiraz-2012 §502 (Estrangela Ālap, stroke 2)"
note = """
"Stroke 4-5 draws the second leg. It starts slightly below the mean line at
pt 4 where it joins the first stroke, moving downward at an angle to pt 5
..., ending either on, or slightly above, the baseline. ... The order of the
two strokes is attested in a very late manuscript where the second stroke is
missing" -- i.e. the order given (leg 1 then leg 2) is the norm, not
absolute.
"""
