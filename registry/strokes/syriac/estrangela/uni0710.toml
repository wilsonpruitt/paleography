# History: three rounds of hand-picked sample points each got caught by
# Wilson cutting a corner or, once padded with enough points to stop
# cutting, reading as jolty/kinked (Bēth's loop, Gāmal's reversal, both hit
# this). The problem was never the smoothing math -- it was that manually
# eyeballed points can't be trusted to sit exactly on the true centerline or
# be evenly spaced through a turn. Replaced hand-picking with an actual
# skeleton trace: skimage.morphology.skeletonize on the rasterized outline,
# a pixel-adjacency graph (networkx), shortest path between the stroke's
# start/end (snapped to the nearest skeleton pixel), then Ramer-Douglas-
# Peucker simplification (eps=4 font units) down to a manageable point
# count. This is the medial axis of the real ink, not a guess at it -- see
# an ad hoc rig pulled together for this, not yet a first-class
# tools/strokes.py command. Order, stroke count, direction and every quoted
# phrase are Kiraz's; only the coordinates are this font's, traced not
# guessed.

[[stroke]]
median = [[910.0, 546.7], [868.3, 545.3], [790.3, 484.3], [706.3, 434.7], [615.7, 393.7], [521.7, 363.0], [433.7, 344.3], [360.3, 337.0], [224.0, 334.3], [116.3, 335.0], [118.0, 273.7], [165.7, 33.7], [179.7, 22.0]]
