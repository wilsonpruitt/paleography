source = "kiraz-2012 §502 (Estrangela Ālap, stroke 1)"
note = """
"Stroke 1-2-3 draws the horizontal shaft and the first leg of the graph. It
begins half-way between the mean and ascender lines at pt 1, moves downward
and to the left to pt 2, then makes a sharp turn and continues downward to
pt 3, ending either on, or slightly below, the baseline. In some hands, the
stroke is clubbed at pt 1."
"""

