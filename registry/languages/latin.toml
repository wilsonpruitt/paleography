<p>The same script as Latin I, and much harder going — because this time <b>the abbreviations are left as the scribe wrote them</b>.</p><p>It is also a harder kind of book: a school grammar, buried under layers of commentary crammed between and around the lines. Some pages carry three hundred lines of writing.</p><p><b>Type what is on the page, not what it stands for.</b> <code>ꝓ</code> stays <code>ꝓ</code>; it does not become <em>pro</em>. When a line contains a sign you have not met, it is explained underneath. Come here once Cod. 940 reads easily.</p><p><b>One thing about these pictures.</b> Every line here is cut from a real page, and a real page is crowded — lines above and below crowd in, and a decorated capital may loom beside them. So <b>the line you are working on is left in focus and everything else is softened.</b> The soft material is really there on the parchment; it is not a bad scan, and it is not being hidden from you. It is out of focus so your eye knows where to sit.</p><h3>The same line, twice</h3>
"""
