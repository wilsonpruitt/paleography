<p>Beyond the letterforms, watch for <b>abbreviation signs</b>: a stroke over a vowel (<code>ũ ẽ ã õ ĩ</code>) for a missing <em>m</em> or <em>n</em>; <code>ę</code> as the medieval way of writing <em>ae</em>; <code>ꝑ</code> for <em>per</em>. The buttons under the typing box enter them for you, and every line explains its own signs.</p><p>Go to <b>Stage one</b> and read a dozen lines before typing a word.</p>
