# Language space: Syriac. The fourth language, the first written right to left, and the
# first that is not an alphabet — an abjad, whose vowels are not on the page at all.
#
# ⭐ Chosen to go first among the RTL scripts because it isolates ONE new problem. The
# direction is new; the normalisation is not — this witness carries no vowel points and
# has no final forms to fold. Hebrew meets both at once, and now meets them second.

id = "syriac"
order = 4
name = "Syriac"
profile = "syriac"

# ⬜ EMPTY SEAT, and the primer says so on its face. Wilson reads Latin and Greek. Every
# grammatical claim in the Syriac primer — which dot makes a participle, which makes a
# perfect, what an unpointed ܡܢ is doing — is drawn from the counted data plus standard
# reference grammar, and none of it has been ruled on by a Syriacist. That is the first
# thing to hand to a reader who offers.
expert = ""

# Almost nobody arrives reading Syriac, so this language points outward, as Old French
# does. ⛔ Note that EIEOL cannot serve here: it is Indo-European by definition, and
# Syriac is Semitic. These are the openly available routes in.
[[resources]]
label = "Beth Mardutho — the Syriac Institute"
url = "https://sedra.bethmardutho.org/"
note = "SEDRA, the lexical database behind most modern Syriac tools; free, and the place to look a word up."

[[resources]]
label = "Dukhrana Biblical Research — the Peshitta, word by word"
url = "https://dukhrana.com/"
note = "The Gospels in Syriac with a lexical analysis under every word. This track IS the Gospels, so a line you cannot crack can be looked up in the text it came from."

# ⛔ Said plainly because it is true and a learner should not waste an evening looking:
# there is no free ten-lesson online course for Syriac of the kind Old French has at the
# Texas LRC. The way in is a printed grammar (Thackston, Robinson, Muraoka) plus the two
# tools above. ⬜ If a Syriacist takes the empty seat, ask them what they would send a
# beginner to, and replace this note with it.

