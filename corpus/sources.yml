# Seed ground truth registry. Phase 1, 2026-08-26.
#
# `layer` is DECLARED here, never inferred from the file, and every entry carries
# `layer_evidence` -- the catalogue was wrong about this once already (see INGEST-NOTES §1).
# ⛔ Licences are PER ENTRY and are NOT all CC-BY 4.0. This header used to say they were;
# that blanket claim is what hid two wrong licences for months. Every entry carries `license`
# plus `license_evidence` naming WHERE the claim comes from, and the catalogue is never the
# source of it. Run `python3 tools/licence_check.py` — see INGEST-NOTES §12.

latin_caroline:
  - id: wien940
    title: "Wien ÖNB Cod. 940, ff. 13r-142v (HTR Winter School 2024)"
    witness: "Salzburg/Saint-Amand, s. VIII ex./IX in.; anonymous Irish commentary on Matthew"
    date: 800-850
    script: Carolingian minuscule
    format: TEI-facsimile        # catalogue says Page-XML and is WRONG
    lines: 7889
    layer: expanded            # ⛔ CORRECTED 2026-08-27 -- I had this as `diplomatic`
    layer_evidence: >
      PROBE, 7,889 lines: ZERO occurrences of ꝑ ꝓ ꝗ ꝰ ᷑ ÷ ⁊ ł đ, zero combining tilde,
      zero nasal-marked vowels. A 9th-c. Latin manuscript cannot contain no abbreviations;
      the transcribers resolved them all silently. Confirmed on the plate: the ink of
      0159_p159 reads `sca` (stroked) and `ē`, the transcription writes `sancta` and `est`.
      ⛔ My earlier evidence -- "line-break hyphen ¬ preserved (1790x)" -- was about
      LINEATION and said nothing about abbreviation. It is the exact error INGEST-NOTES §1
      documents, committed by the person who wrote that note.
    license: ⚠ CONTESTED -- same conflict as onb-syr1, see its license_conflict
    license_evidence: >
      ⛔ CORRECTED 2026-09-01 by tools/licence_check.py. This said flat CC-BY-4.0 while the
      onb-syr1 entry already documented that BOTH Winter School repositories carry a BY-SA
      LICENSE.md beside a BY 4.0 htr-united.yml. The conflict was written down once and not
      propagated to the other entry it applies to -- which is why the check is now mechanical
      and not a note. The site states BY-SA for both, which is true under either reading.
    url: https://github.com/HTR-School-Vienna/-2024--carolingian-latin
    images_in_repo: false        # 3.4 MB, XML only
    # Images fetched from the Austrian National Library over IIIF, 2026-08-27.
    # Full detail and the failed routes: research/onb-cod940-iiif.md
    iiif:
      manifest: https://api.onb.ac.at/iiif/presentation/v3/manifest/10047947
      canvases: 290              # exactly matches the TEI's 290 surfaces
      leaf_to_canvas_offset: -2  # VERIFIED: 125/125 exact dimension matches.
                                 # offset 0 gives 88/125 -- plausible, and wrong for 37 pages
      full_resolution: ~1220x1853  # this is the real maximum, not a cap (see info.json)
      attribution: "Österreichische Nationalbibliothek"
      rights: >
        No rights IRI on the manifest; a requiredStatement asks for attribution. ÖNB's
        site terms state it claims no exploitation right and consents to re-use at web
        resolution with attribution requested. ⚠ Treat as attribution-required, and keep
        the statement with any published crop.
      coordinate_scaling: >
        REQUIRED, and not uniform. The TEI states 2479x3508 for 137 of the 262 GT-bearing
        pages; that is a Transkribus PLACEHOLDER, not a real size -- canvases at those
        leaves run 566-1320 px wide. Those pages were uploaded stretched to a fixed size,
        so x and y scale INDEPENDENTLY (sx = canvas_w/tei_w, sy = canvas_h/tei_h). The
        other 125 pages carry real dimensions and scale 1:1. Both classes were verified by
        fetching a line region and reading it against its transcription.
    derived:
      images: corpus/raw/wien940-images/
      rescaled_gt: corpus/normalized/wien940-iiif.jsonl   # coordinates in IIIF image space

  - id: eutyches-VLO41
    title: "Eutyches, De uerbo -- Leiden Voss. Lat. O. 41"
    date: 850-900
    script: Caroline minuscule, 4 hands + 4 annotating hands
    format: ALTO-v4
    lines: 2741
    pages: 63
    layer: diplomatic
    layer_evidence: "repo README: graphematic, abbreviations preserved; chocomufin table.csv controls charset"
    license_evidence: >
      ⛔ CORRECTED 2026-09-01 by tools/licence_check.py. This entry said CC-BY-4.0, which is
      the HTR-United CATALOGUE's claim, not the depositor's. The repository's only licence file
      is the Apache License 2.0, there is no htr-united.yml in it, the README makes no licence
      statement, and the Zenodo deposit (DOI 10.5281/zenodo.15646103, "Eutyches 'de uerbo'
      glossed") also declares Apache-2.0 and types the record as SOFTWARE. Three places, one
      answer, and it is not CC BY.
      ⚠ This is not the two-licences trap — it is an ABSENCE. A software licence applied to a
      text corpus says nothing about the data, so the GT for a LIVE track (Latin II) had no
      data licence declared anywhere and we were asserting one on the landing page.
      What turns on it: Apache-2.0 is permissive — use, modification and redistribution are all
      allowed provided copyright and licence notices are preserved — and, unlike the Vienna
      BY-SA, it carries NO share-alike and NO non-commercial term, so it does not collide with
      the Wroot Press CC BY-NC default. The problem was never permission; it was that the site
      credited the depositor under a licence they never chose.
      ⬜ Owed: ask Malamatenia Papadopoulou whether Apache-2.0 was meant to cover the GT as well
      as the code. Same class of question as the Winter School email, and equally one sentence.
    license: Apache-2.0        # ⛔ NOT CC-BY — see license_evidence
    url: https://github.com/malamatenia/Eutyches
    note: "richly glossed; MainZone + MarginTextZone both present"

